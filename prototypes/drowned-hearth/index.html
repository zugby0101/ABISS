<script>
'use strict';
// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = '"Courier New", ui-monospace, Menlo, monospace';
const TITLE = 'Drowned Hearth';
const CONTROLS = ['A D W S: swim', 'J: light swing   K: heavy swing', 'L: roll   Shift: guard', 'R: drink flask   Space: harpoon', 'E: use / open   P: pause   M: mute'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function mkr(s) { // a private seeded stream: the level layout of a depth is always the same
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', shadow = true) {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText(s, x + 2, y + 2); }
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}

// ---- Input ---------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());
const held = (...c) => c.some(k => down.has(k));
const tapped = (...c) => c.some(k => hit.has(k));

// ---- Audio ---------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
    try { // a low drone under the sea
      const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = 55; f.type = 'lowpass'; f.frequency.value = 160; g.gain.value = 0.05;
      o.connect(f); f.connect(g); g.connect(out); o.start(); audio.drone = o;
    } catch (e) { /* no drone */ }
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}

// ---- Helpers ---------------------------------------------------------------------------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sgn = v => (v < 0 ? -1 : 1);
const hyp = Math.hypot;
const rnd = (a, b) => a + rng() * (b - a);
const pick = a => a[Math.floor(rng() * a.length)];
const U = 3; // one drawn pixel
const snap = v => Math.round(v / U) * U;
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x * U, y * U, w * U, h * U); } // a block in pixel units
function fig(x, y, face, scale, fn) { ctx.save(); ctx.translate(snap(x), snap(y)); ctx.scale(face * scale, scale); fn(); ctx.restore(); }
function glow(x, y, r, rgb, a) {

function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill(); }

// ---- World constants and data ----------------------------------------------------------
const FLOOR = 640, TOPY = 100, ARENA_L = 2560, ARENA_R = 3960, LVLEN = 4000, ROPE_X = 90;
const TAV = { y: 598, hearth: 200, shrine: 395, cauldron: 585, counter: 775, anvil: 945, door: 1135 };
const ITEMS = {

  glowfin: { n: 'Glowfin', v: 14, dish: 'Glowfin Broth', fx: { stam: 0.3 }, desc: '+30% stamina regen' },
  squid: { n: 'Ink Squid', v: 18, dish: 'Inked Noodles', fx: { o2: 45 }, desc: '+45s of air' },
  pearl: { n: 'Coral Pearl', v: 45 },

  bell: { n: 'Jelly Bell', v: 20, dish: 'Jelly Pudding', fx: { flask: 0.15 }, desc: 'flasks heal 15% more' },

  helm: { n: "Knight's Crest", v: 70 },

  scale: { n: 'Maw Scale', v: 80 },

  shard: { n: 'Crown Shard', v: 110 },
  eye: { n: 'Leviathan Eye', v: 180 },

const DROPS = { angler: [['lamp', 0.7], ['glowfin', 1]], jelly: [['bell', 0.6], ['squid', 1]], crab: [['claw', 0.85], ['silverfin', 1]], eel: [['fang', 0.8], ['glowfin', 1]] };
const BOSSDEF = {
  1: { k: 'knight', name: 'The Drowned Knight', th: [0.5], parts: ['helm'], fin: 'plate' },
  2: { k: 'maw', name: 'Maw of the Reef', th: [0.66, 0.33], parts: ['scale', 'scale'], fin: 'tooth' },
  3: { k: 'levi', name: 'The Crowned Leviathan', th: [0.75, 0.5, 0.25], parts: ['shard', 'shard', 'shard'], fin: 'eye' },
};
const DEPTHS = ['', 'The Shallow Wreck', 'The Kelp Cathedral', 'The Black Trench'];
const depthName = d => DEPTHS[d] || `The Abyss, floor ${d - 3}`;
const WEAPON_COST = [60, 110, 170, 240, 330], WEAPON_NEEDS = { 1: 'plate', 3: 'tooth' };

// ---- State ----------------------------------------------------------------------------
let scene, state;
const cam = { x: 0, sh: 0 };
function newSave() {
  return { lvl: 1, vig: 0, end: 0, str: 0, souls: 0, gold: 0, bag: {}, wlvl: 0, tank: 0, flaskUp: 0, bagUp: 0,
    cleared: {}, maxDepth: 1, sold: 0, endless: false, endlessDepth: 4, stain: null, dish: null, beaten: 0, cooked: 0 };
}
const dishFx = () => (state.S.dish && ITEMS[state.S.dish] ? ITEMS[state.S.dish].fx : {});
const maxHP = () => tune.hp + 10 * state.S.vig + (dishFx().hp || 0);
const maxStam = () => tune.stamina + 8 * state.S.end;
const maxFlasks = () => tune.flasks + state.S.flaskUp;
const maxO2 = () => tune.oxygen + 25 * state.S.tank + (dishFx().o2 || 0);
const bagCap = () => tune.bag_cap + 2 * state.S.bagUp;
const bagCount = () => Object.values(state.S.bag).reduce((a, b) => a + b, 0);
const dmgMul = () => (1 + 0.08 * state.S.str) * (1 + tune.weapon_dmg * state.S.wlvl) * (1 + (dishFx().dmg || 0));
const renown = () => Math.min(10, Math.floor(state.S.sold / tune.renown_per_sale));
const sellPrice = id => Math.round(ITEMS[id].v * tune.sell_mult * (1 + 0.05 * renown()));
const levelCost = () => Math.round(tune.level_cost + tune.level_growth * (state.S.lvl - 1));

function newPlayer() {
  return { x: TAV.hearth + 70, y: TAV.y, vx: 0, vy: 0, face: 1, hp: maxHP(), stam: maxStam(), o2: maxO2(), flasks: maxFlasks(),
    act: null, at: 0, dur: 0, inv: 0, flash: 0, cd: 0, regen: 0, buf: null, bufT: 0, hitSet: new Set(), guard: false,
    rdx: 1, rdy: 0, stun: 0, swung: false, anim: 0 };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = { t: 0, score: 0, gained: '', mode: 'tavern', S: newSave(), depth: 1, mobs: [], proj: [], haz: [], fx: [], fish: [], chests: [],
    picks: [], boss: null, gate: false, exit: null, menu: null, toast: null, banner: null, hs: 0, bg: null, deathT: 0,
    victoryT: 0, near: null, line: null, snow: [] };
  state.p = newPlayer();
  for (let i = 0; i < 70; i++) state.snow.push({ x: rng() * W, y: rng() * H, z: 0.3 + rng() * 1.1, s: rng() * 6 });
  cam.x = 0; cam.sh = 0;
  if (params.get('dive')) { const d = clamp(Number(params.get('dive')) || 1, 1, 9); state.S.maxDepth = 9; startDive(d); state.p.x = Number(params.get('x')) || state.p.x; }
}
function toast(s, t = 2.4) { state.toast = { s, t }; }
function banner(s, sub, t = 3) { state.banner = { s, sub, t, t0: t }; }
function fxText(x, y, s, c = '#fff', size = 22) { state.fx.push({ type: 'txt', x, y, s, c, size, t: 0, life: 1.1 }); }
function burst(x, y, n, c, sp = 160, life = 0.6, add = false) {
  for (let i = 0; i < n; i++) { const a = rng() * 6.283, v = rnd(0.3, 1) * sp; state.fx.push({ type: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c, t: 0, life: life * rnd(0.6, 1), sz: rnd(2, 5), add }); }
}
function giveItem(id, n = 1) {
  if (bagCount() + n > bagCap()) { toast('Your bag is full: the catch sinks away'); return false; }
  state.S.bag[id] = (state.S.bag[id] || 0) + n;
  fxText(state.p.x, state.p.y - 50, '+' + ITEMS[id].n, '#9ff0e0', 18);
  tone(660, 0.1, 'triangle', 0.18); return true;
}
function giveSouls(n) { state.S.souls += n; state.score += n; fxText(state.p.x, state.p.y - 76, '+' + n + ' souls', '#ffd27a', 18); }

// ---- Levels --------------------------------------------------------------------------
function startDive(d, keep) {
  const st = state, p = st.p;
  st.mode = 'dive'; st.depth = d; st.menu = null; st.mobs = []; st.proj = []; st.haz = []; st.fish = []; st.chests = [];
  st.picks = []; st.gate = false; st.exit = null; st.boss = null; st.fx = []; st.line = null; st.bossIntro = false;
  const r = mkr(d * 7919 + 13), kd = ((d - 1) % 3) + 1;
  const kinds = ['angler', 'jelly']; if (kd >= 2 || d > 3) kinds.push('crab'); if (kd >= 3 || d > 3) kinds.push('eel');
  let x = 760, i = 0;
  while (x < 2400) {
    let k = i === 0 ? 'angler' : kinds[Math.floor(r() * kinds.length)];
    if (i === 2 && d > 1) k = kinds[Math.min(kinds.length - 1, kd === 1 ? 1 : kd)];
    if (i === 1 && d === 1) k = 'jelly';
    let elite = false;
    if (d === 1 && x > 1450 && !st.eliteDone) { k = 'angler'; elite = true; st.eliteDone = true; }
    else if (d > 1 && i % 5 === 4) elite = true;
    const y = k === 'crab' ? FLOOR - 26 : k === 'eel' ? FLOOR - 14 : k === 'jelly' ? 170 + r() * 230 : 200 + r() * 320;
    st.mobs.push(mkMob(k, x, y, { elite }));
    x += 150 + r() * 90; i++;
  }
  st.eliteDone = false;
  for (let s = 0; s < 6; s++) {
    const sx = 480 + s * 400 + r() * 150, sy = 170 + r() * 340, n = 3 + Math.floor(r() * 3);
    for (let j = 0; j < n; j++) st.fish.push({ x: sx + r() * 70, y: sy + r() * 60, vx: -30 - r() * 20, face: -1, ph: r() * 6, dead: false });
  }
  st.chests.push({ x: 900 + r() * 500, open: false }, { x: 1750 + r() * 500, open: false });
  st.bg = genBG(d); st.boss = mkBoss(d); st.shake = 0;
  st.stain = st.S.stain && st.S.stain.depth === d ? st.S.stain : null;
  if (!keep) { p.x = ROPE_X + 90; p.y = 300; p.vx = 0; p.vy = 0; p.o2 = maxO2(); }
  p.face = 1; p.act = null; p.stun = 0; cam.x = 0;
  banner(depthName(d), d > 3 ? 'Endless descent' : 'Depth ' + d, 2.6);
}
function enterTavern(rest) {
  const st = state, p = st.p;
  st.mode = 'tavern'; st.menu = null; st.mobs = []; st.proj = []; st.haz = []; st.fx = []; st.boss = null; st.gate = false;
  st.exit = null; st.line = null; st.picks = [];
  p.x = TAV.door - 90; p.y = TAV.y; p.vx = 0; p.vy = 0; p.act = null; p.stun = 0; p.face = -1; p.o2 = maxO2();
  if (rest) restAll();
  cam.x = 0;
}
function restAll() {
  const p = state.p;
  p.hp = maxHP(); p.stam = maxStam(); p.flasks = maxFlasks(); p.o2 = maxO2(); save();
}
function save() { try { localStorage.setItem('drowned-hearth', JSON.stringify(state.S)); } catch (e) { /* no storage */ } }
function loadSave() { try { const s = JSON.parse(localStorage.getItem('drowned-hearth')); return s && s.lvl ? s : null; } catch (e) { return null; } }

// ---- The diver ------------------------------------------------------------------------
function spend(n) { const p = state.p; p.stam = Math.max(0, p.stam - n); p.regen = tune.stam_delay; }
function buf(a) { const p = state.p; p.buf = a; p.bufT = 0.28; }
function startAct(a, ix, iy) {
  const p = state.p;
  if (a === 'light' && p.stam > 0) {
    spend(tune.light_cost); p.act = 'light'; p.dur = tune.light_time; p.at = 0; p.hitSet = new Set(); p.buf = null; tone(240, 0.09, 'sawtooth', 0.1, -90);
  } else if (a === 'heavy' && p.stam > 0) {
    spend(tune.heavy_cost); p.act = 'heavy'; p.dur = tune.heavy_time; p.at = 0; p.hitSet = new Set(); p.buf = null; tone(150, 0.2, 'sawtooth', 0.12, -60);
  } else if (a === 'roll' && p.stam > 0) {
    spend(tune.roll_cost); p.act = 'roll'; p.dur = tune.roll_time; p.at = 0; p.buf = null;
    const m = hyp(ix, iy); if (m) { p.rdx = ix / m; p.rdy = iy / m; if (ix) p.face = ix; } else { p.rdx = p.face; p.rdy = 0; }
    tone(300, 0.14, 'triangle', 0.1, 200);
  } else if (a === 'flask') {
    if (p.flasks > 0 && p.hp < maxHP()) { p.act = 'drink'; p.dur = tune.flask_time; p.at = 0; p.flasks--; p.buf = null; tone(420, 0.3, 'sine', 0.12, 120); }
    else p.buf = null;
  } else if (a === 'harpoon') {
    p.buf = null; if (p.cd <= 0) { p.cd = tune.harpoon_cd; fireHarpoon(); }
  } else p.buf = null;
}
function updPlayer(dt) {
  const p = state.p, dive = state.mode === 'dive';
  p.inv -= dt; p.flash -= dt; p.cd -= dt; p.stun -= dt; p.anim += dt; p.bufT -= dt;
  if (p.bufT <= 0) p.buf = null;
  if (dive) {
    if (tapped('KeyJ')) buf('light'); if (tapped('KeyK')) buf('heavy'); if (tapped('KeyL')) buf('roll');
    if (tapped('KeyR')) buf('flask'); if (tapped('Space')) buf('harpoon');
  }
  const ix = (held('KeyD', 'ArrowRight') ? 1 : 0) - (held('KeyA', 'ArrowLeft') ? 1 : 0);
  const iy = dive ? (held('KeyS', 'ArrowDown') ? 1 : 0) - (held('KeyW', 'ArrowUp') ? 1 : 0) : 0;
  if (p.act) {
    p.at += dt;
    if (p.at >= p.dur) {
      if (p.act === 'drink') { p.hp = Math.min(maxHP(), p.hp + maxHP() * tune.flask_heal * (1 + (dishFx().flask || 0))); fxText(p.x, p.y - 56, 'restored', '#9ff0e0', 18); burst(p.x, p.y, 10, '#8ff', 90, 0.6, true); }
      p.act = null; p.at = 0;
    }
  }
  p.guard = dive && !p.act && p.stun <= 0 && held('ShiftLeft', 'ShiftRight') && p.stam > 0;
  if (dive && !p.act && p.stun <= 0 && p.buf) startAct(p.buf, ix, iy);
  p.regen -= dt;
  if (p.regen <= 0 && p.act !== 'light' && p.act !== 'heavy' && p.act !== 'roll') {
    p.stam = Math.min(maxStam(), p.stam + tune.stam_regen * (1 + (dishFx().stam || 0)) * (p.guard ? 0.4 : 1) * dt);
  }
  if (dive && p.act && (p.act === 'light' || p.act === 'heavy')) {
    const k = p.at / p.dur;
    const on = p.act === 'light' ? k > 0.28 && k < 0.62 : k > 0.42 && k < 0.64;
    if (on) meleeHit(p.act);

  // movement: swimming has weight
  if (p.stun > 0) { p.vx *= 0.9; p.vy *= 0.9; }
  else if (p.act === 'roll') { const s = tune.roll_speed * (1 - (p.at / p.dur) * 0.55); p.vx = p.rdx * s; p.vy = p.rdy * s * 0.8; }

    const m = p.act === 'light' || p.act === 'heavy' ? 0.3 : p.act === 'drink' ? 0.25 : p.guard ? 0.5 : 1;

    p.vy += (iy * tune.swim_speed * m - p.vy) * k;

  p.x += p.vx * dt; p.y += dive ? p.vy * dt : 0;
  if (dive) {
    p.x = clamp(p.x, state.gate ? ARENA_L + 14 : 30, LVLEN - 30);
    p.y = clamp(p.y, TOPY, FLOOR - 34);
  } else { p.x = clamp(p.x, 70, TAV.door + 40); p.y = TAV.y; }
  if (p.hp > maxHP()) p.hp = maxHP();
}
function meleeHit(kind) {
  const p = state.p, heavy = kind === 'heavy', range = heavy ? tune.heavy_range : tune.light_range;
  const bx = p.x + p.face * (range / 2 + 6), bhw = range / 2 + 10, by = p.y, bhh = 46;
  const base = (heavy ? tune.heavy_dmg : tune.light_dmg) * dmgMul();
  for (const m of state.mobs) {
    if (m.dead || m.hidden || p.hitSet.has(m)) continue;
    if (hit2(bx, by, bhw, bhh, m.x, m.y, m.hw, m.hh)) { p.hitSet.add(m); hurtMob(m, base, { kind, stag: heavy }); state.hs = 0.05; }
  }
  for (const f of state.fish) {
    if (f.dead || p.hitSet.has(f)) continue;
    if (hit2(bx, by, bhw, bhh, f.x, f.y, 16, 10)) { p.hitSet.add(f); killFish(f); }
  }
  const b = state.boss;
  if (b && !p.hitSet.has(b)) {
    for (const hb of bossBoxes(b)) {
      if (hit2(bx, by, bhw, bhh, hb.x, hb.y, hb.hw, hb.hh)) { p.hitSet.add(b); hurtBoss(b, base * hb.mul, { heavy }); state.hs = heavy ? 0.09 : 0.05; break; }
    }
  }
}
function fireHarpoon() {
  const p = state.p, f = p.face, range = tune.harpoon_range;
  let best = null, bd = 1e9, kind = null;
  for (const m of state.mobs) {
    if (m.dead || m.hidden) continue;
    const dx = (m.x - p.x) * f;
    if (dx > 0 && dx < range + m.hw && Math.abs(m.y - p.y) < m.hh + 22 && dx < bd) { best = m; bd = dx; kind = 'mob'; }
  }

// Maw of the Reef: a great moray that charges, bites up from the floor, spits ink, then coils
function followChain(b) {
  const s = b.segs; s[0].x = b.x; s[0].y = b.y;
  for (let i = 1; i < s.length; i++) {
    const a = s[i - 1], c = s[i], dx = a.x - c.x, dy = a.y - c.y, d = hyp(dx, dy) || 1;

function steer(b, tx, ty, sp, dt) { const dx = tx - b.x, dy = ty - b.y, d = hyp(dx, dy) || 1, s = Math.min(sp * dt, d); b.x += dx / d * s; b.y += dy / d * s; b.face = dx >= 0 ? 1 : -1; }

  const p = state.p;

}
function chooseMaw(b) {
  const p = state.p, o = ['charge', 'charge', 'floor']; if (b.phase >= 2) o.push('ink', 'floor'); if (b.phase >= 3) o.push('coil', 'charge');
  const a = pick(o); b.atk = a; b.shots = 0;

  if (a === 'floor') {
    b.st = 'ftele'; b.tm = 0.9; b.bx = clamp(p.x, ARENA_L + 120, ARENA_R - 120);
    addHaz(b.bx, FLOOR - 150, 55, 170, 0.9, 0.35, 28 * b.dm, 'bite');
  }

function updMaw(b, dt) {

  switch (b.st) {

      b.tm -= dt; if (b.tm <= 0) chooseMaw(b); break; }
    case 'ctele':

      b.face = Math.cos(b.aim) >= 0 ? 1 : -1; b.x += (rng() - 0.5) * 3;
      if (b.tm <= 0) { b.st = 'charge'; b.tm = 0.85; tone(70, 0.5, 'sawtooth', 0.25, -20); }
      break;
    case 'charge':
      b.x = clamp(b.x + Math.cos(b.aim) * 820 * ls * dt, ARENA_L + 40, ARENA_R - 20); b.y = clamp(b.y + Math.sin(b.aim) * 820 * ls * dt, TOPY + 30, FLOOR - 40);

// The Crowned Leviathan: stays at the far end; its face must be reached through what it throws

function updLevi(b, dt) {

// ---- The world each step ---------------------------------------------------------------
function updTavern(dt) {
  const st = state, p = st.p;
  updPlayer(dt);
  const stations = [
    { x: TAV.hearth, label: 'E: rest by the hearth', fn: menuHearth }, { x: TAV.shrine, label: 'E: lantern shrine (spend souls)', fn: menuShrine },
    { x: TAV.cauldron, label: 'E: cauldron (cook the catch)', fn: menuCauldron }, { x: TAV.counter, label: 'E: counter (sell and buy)', fn: menuCounter },
    { x: TAV.anvil, label: 'E: anvil (sharpen your blade)', fn: menuAnvil }, { x: TAV.door, label: 'E: the dive door', fn: menuDoor },
  ];
  st.near = null;
  for (const s of stations) if (Math.abs(p.x - s.x) < 85) st.near = s;
  if (st.near && tapped('KeyE')) st.near.fn();
  if (rng() < dt * 6) st.fx.push({ type: 'p', x: TAV.hearth + rnd(-30, 30), y: TAV.y - 90, vx: rnd(-10, 10), vy: -rnd(40, 90), c: '#ffb050', t: 0, life: 0.9, sz: 3, add: true });
  if (rng() < dt * 3) st.fx.push({ type: 'p', x: TAV.cauldron + rnd(-24, 24), y: TAV.y - 80, vx: rnd(-8, 8), vy: -rnd(30, 60), c: '#a8e8b0', t: 0, life: 1.4, sz: 4, add: false });
}
function updDive(dt) {

  const b = st.boss;
  if (b && b.st === 'sleep' && p.x > ARENA_L + 190) {
    st.gate = true; b.st = 'intro'; b.tm = 2.4; banner(b.name, 'Depth ' + st.depth + ' guardian', 3.2); tone(55, 1.4, 'sawtooth', 0.3, -10); st.shake = 8;
  }

    if (f.dead) continue;
    f.ph += dt; const d = hyp(f.x - p.x, f.y - p.y);
    f.vx = d < 130 ? sgn(f.x - p.x) * 95 : (f.x < 120 ? 38 : f.vx < 0 ? -36 : 36);
    f.face = sgn(f.vx); f.x += f.vx * dt; f.y += Math.sin(f.ph * 2) * 10 * dt;
  }
  for (const pk of st.picks) {
    pk.t += dt;
    if (hyp(pk.x - p.x, pk.y - p.y) < 50) {
      S.bag[pk.id] = (S.bag[pk.id] || 0) + 1; pk.done = true; fxText(p.x, p.y - 50, '+' + ITEMS[pk.id].n, '#ffd27a', 20); tone(780, 0.2, 'triangle', 0.2, 300);
    }
  }
  st.picks = st.picks.filter(pk => !pk.done);
  const sn = S.stain;
  if (st.stain && S.stain === st.stain && hyp(sn.x - p.x, sn.y - p.y) < 56) {

  drawDiver2();

  glow(TAV.door, 540, 160, '90,220,230', 0.4);
  for (const f of st.fx) if (f.type === 'p') { ctx.fillStyle = f.c; ctx.globalAlpha = 1 - f.t / f.life; ctx.fillRect(snap(f.x), snap(f.y), f.sz, f.sz); ctx.globalAlpha = 1; }
}

// ---- Drawing: the dive and its HUD -------------------------------------------------------
function bar(x, y, w, h, frac, col, back = 'rgba(0,0,0,0.6)', edge = '#c8d4dc') {

}
function drawFlaskIcon(x, y, full) { ctx.save(); ctx.translate(x, y); R(1, 0, 2, 2, full ? '#c8d4dc' : '#3a4650'); R(0, 2, 4, 5, full ? '#35e8d4' : '#1a2a30'); R(0, 6, 4, 1, full ? '#8ffff0' : '#1a2a30'); ctx.restore(); }

  if (dive) text('J light  K heavy  L roll  Shift guard  R flask  Space harpoon  E use', 24, 706, 16, 'rgba(200,225,235,0.8)', 'left');

function drawDive() {
  const st = state, p = st.p, P = pal(st.depth);
  glowQ = [];
  drawSea();
  const sx = (st.shake || 0) * (Math.sin(st.t * 90) * 0.6), sy = (st.shake || 0) * (Math.cos(st.t * 77) * 0.6);
  ctx.save(); ctx.translate(-Math.round(cam.x) + sx, sy);
  drawDiveProps();
  for (const f of st.fish) if (!f.dead) drawFishPx(f);
  for (const m of st.mobs) { if (m.dead) continue; if (m.x < cam.x - 300 || m.x > cam.x + W + 300) { if (m.k !== 'eel') continue; } ({ angler: drawAngler, jelly: drawJelly, crab: drawCrab, eel: drawEel })[m.k](m); }
  if (st.boss) drawBoss(st.boss);
  drawFloor(P);
  for (const pk of st.picks) { const y = pk.y + Math.sin(pk.t * 3) * 5; glowQ.push([pk.x, y, 60, '255,210,120', 0.9]); ctx.fillStyle = '#ffd27a'; ctx.fillRect(snap(pk.x - 9), snap(y - 9), 18, 18); ctx.fillStyle = '#fff'; ctx.fillRect(snap(pk.x - 3), snap(y - 6), 6, 6); }
  drawHazards();

  for (const f of st.fx) {

  for (const [gx, gy, r, rgb, al] of glowQ) glow(gx - Math.round(cam.x) + sx, gy + sy, r, rgb, al);
  for (const f of st.fx) if (f.type === 'txt') { ctx.globalAlpha = clamp(1 - f.t / f.life, 0, 1); text(f.s, f.x - cam.x, f.y, f.size, f.c); ctx.globalAlpha = 1; }
  if (p.hp / maxHP() < 0.3 && st.mode === 'dive') { ctx.fillStyle = `rgba(120,0,0,${0.12 + 0.08 * Math.sin(st.t * 6)})`; ctx.fillRect(0, 0, W, H); }
}
function drawMenu() {
  const m = state.menu; if (!m) return;

// ---- Scenes ------------------------------------------------------------------------------

  const kb = mkBoss(1); kb.st = 'idle'; kb.x = 0; kb.y = FLOOR; kb.face = 1; ctx.save(); ctx.translate(200, 560 - FLOOR); ctx.scale(0.75, 0.75); ctx.translate(0, FLOOR * 0.25 + 0); drawKnight(Object.assign(kb, { x: 0 })); ctx.restore(); lab('The Drowned Knight', 200, 640);

  const lb = mkBoss(3); lb.st = 'idle'; lb.x = 0; lb.y = 0; lb.t = t; ctx.save(); ctx.translate(960, 460); ctx.scale(0.55, 0.55); drawLevi(lb); ctx.restore(); lab('The Crowned Leviathan', 960, 640);
  drawPatron(1180, 200, -1, 1); lab('Patron', 1180, 250);

}
function drawTitle() {

  for (const [gx, gy, r, rgb, al] of glowQ) glow(gx - Math.round(cam.x), gy, r, rgb, al);
  glow(W / 2, 170, 360, '255,170,70', 0.25);

const scenes = {
  figures: { update(dt) { state.t += dt; }, draw() { figuresDraw(); } },
  title: {
    update(dt) {
      state.t += dt;
      if (pressed('KeyC') && loadSave()) { reset(); state.S = Object.assign(newSave(), loadSave()); state.p = newPlayer(); enterTavern(true); scene = 'play'; toast('Welcome back.'); }
      else if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; toast('Walk right to the dive door. Use E to use it.', 6); }
    },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      if (!state.menu && (pressed('KeyP') || pressed('Escape'))) { scene = 'pause'; return; }
      updWorld(dt);
    },
    draw() { if (state.mode === 'tavern') drawTavern(); else drawDive(); drawHUD(); drawMenu(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() { scenes.play.draw(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H); text('Paused', W / 2, H / 2 - 20, 56, '#fff'); text('P to go on   M to mute', W / 2, H / 2 + 40, 22, '#cfe'); },
  },
  over: {
    update(dt) { state.deathT += dt; updFx(dt); if (state.deathT > 1.6 && (pressed('Enter') || pressed('KeyR') || pressed('Space'))) respawn(); },
    draw() {
      scenes.play.draw(); const k = clamp(state.deathT / 1.2, 0, 1);
      ctx.fillStyle = `rgba(30,0,0,${0.7 * k})`; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = k; text('YOU DIED', W / 2, H / 2 - 30, 96, '#d83a3a'); ctx.globalAlpha = 1;
      if (state.deathT > 0.8) { text(`Your ${state.S.stain ? state.S.stain.souls : 0} souls and your catch wait where you fell. Reach them before you die again.`, W / 2, H / 2 + 40, 20, '#e8c8c0'); }
      if (state.deathT > 1.6) text('Enter: wake at the hearth', W / 2, H / 2 + 90, 26, '#fff');
    },
  },
  results: {
    update(dt) { state.t += dt; if (pressed('Enter')) { const p = state.p; enterTavern(true); p.hp = maxHP(); scene = 'play'; toast('Endless descent unlocked at the dive door.', 6); save(); } },
    draw() {
      drawDive(); ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
      text('THE DEEP IS QUIET', W / 2, 200, 64, '#ffe3b0'); text('The Crowned Leviathan is felled.', W / 2, 262, 24, '#cfe');
      const S = state.S; [`Level ${S.lvl}   Blade ${S.wlvl}   Renown ${renown()}`, `Souls ${S.souls}   Gold ${S.gold}`, `Bosses felled ${S.beaten}`].forEach((s, i) => text(s, W / 2, 340 + i * 36, 24, '#fff6d0'));
      text('Enter: back to the tavern. The endless descent is open.', W / 2, 520, 24, '#9ff0e0');
    },

};

// ---- Loop: fixed step, frame time clamped ------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (params.get('dive') && scene === 'title') scene = 'play';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
